<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Confirmar pagamento | Service Car</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cssDavi.css">
</head>
<body class="pagamento">
    <!-- ===== CABEÇALHO ===== -->
    <header class="cabecalho">
        <a href="index.html"><img class="logo" src="img/logo_sc.png" alt="Logo do Service Car"></a>
        <h1 id="title">Confirmar pagamento</h1>
        <div class="espaco" aria-hidden="true"></div>
    </header>
    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main>
        <!-- ===== RESUMO DO SERVIÇO ===== -->
        <section class="caixa resumo" aria-label="Resumo do serviço">
            <p><span>Serviço agendado:</span> Polimento estético</p>
            <p><span>Veículo:</span> Honda Civic 2019</p>
            <p><span>Data e hora:</span> 04/11/2026 às 15:30</p>
            <p><span>Valor a pagar:</span> <b>R$ 50,00</b></p>
        </section>
        <h2>Selecione a forma de pagamento</h2>
        <!-- ===== CRÉDITO ===== -->
        <form class="caixa forma-pagamento" data-m="Crédito" novalidate>
            <h3>Crédito <button type="button" class="alterar">Alterar cartão</button></h3>
            <div class="campos">
                <label>Cartão
                    <input name="cartao" inputmode="numeric" maxlength="19" autocomplete="cc-number" placeholder="0000 0000 0000 0000" data-card>
                </label>
                <label>CVC
                    <input name="cvc" inputmode="numeric" maxlength="3" autocomplete="cc-csc" placeholder="000" data-cvc>
                </label>
                <label>Titular
                    <input name="titular" autocomplete="cc-name" placeholder="Nome do titular do cartão">
                </label>
                <label>Parcelas
                    <select name="parcelas">
                        <option>1x de R$ 50,00</option>
                        <option>2x de R$ 25,00</option>
                        <option>3x de R$ 16,67</option>
                    </select>
                </label>
            </div>
            <button class="botao" type="submit">Confirmar pagamento</button>
            <p class="erro" role="alert"></p>
        </form>
        <!-- ===== DÉBITO ===== -->
        <form class="caixa forma-pagamento" data-m="Débito" novalidate>
            <h3>Débito <button type="button" class="alterar">Alterar cartão</button></h3>
            <div class="campos">
                <label>Cartão
                    <input name="cartao" inputmode="numeric" maxlength="19" autocomplete="cc-number" placeholder="0000 0000 0000 0000" data-card>
                </label>
                <label>CVC
                    <input name="cvc" inputmode="numeric" maxlength="3" autocomplete="cc-csc" placeholder="000" data-cvc>
                </label>
                <label>Titular
                    <input name="titular" autocomplete="cc-name" placeholder="Nome do titular do cartão">
                </label>
            </div>
            <button class="botao" type="submit">Confirmar pagamento</button>
            <p class="erro" role="alert"></p>
        </form>
        <!-- ===== PIX ===== -->
        <form class="caixa forma-pagamento" data-m="Pix" novalidate>
            <h3>Pix</h3>
            <div class="campos">
                <label>CPF
                    <input name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" data-cpf>
                </label>
                <label>E-mail
                    <input name="email" type="email" autocomplete="email" placeholder="voce@email.com">
                </label>
                <label>Telefone
                    <input name="telefone" type="tel" maxlength="15" autocomplete="tel" placeholder="(31) 90000-0000">
                </label>
            </div>
            <button class="botao" type="submit">Confirmar pagamento</button>
            <p class="erro" role="alert"></p>
        </form>
        <!-- ===== NAVEGAÇÃO ===== -->
        <nav class="navegacao">
            <a href="servicos.html">Página de serviços</a>
            <a href="historicoServico.html">Histórico de serviços</a>
        </nav>
    </main>
    <script src="scriptdavi.js" defer></script>
</body>
</html>

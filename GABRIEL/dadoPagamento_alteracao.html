<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- REDIRECIONAMENTO_PHP --><meta http-equiv="refresh" content="0;url=PHP/dadoPagamento_alteracao.php"><!-- FIM_REDIRECIONAMENTO_PHP -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar dados de pagamento | Service Car</title>
    <link rel="stylesheet" href="CSS/dadoPagamento_alteracao.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <nav aria-label="Cabeçalho">
            <a class="logo" href="../HTML/index.html" aria-label="Página inicial do Service Car">
                <object data="../logo_sc.png" type="image/png" aria-label="Logo Service Car">
                    <span class="logo-texto" aria-hidden="true">SERVICE<br>CAR</span>
                </object>
            </a>
            <h1>Área do Usuário</h1>
        </nav>
    </header>
    <main>
        <!-- Menu lateral -->
        <aside aria-label="Menu da área do usuário">
            <h2><a href="dadoPessoal.html">Dados gerais</a></h2>
            <h2><a href="PHP/dadoPagamento.php" class="ativo" aria-current="true">Dados de pagamento</a></h2>
        </aside>
        <!-- Conteúdo principal -->
        <section class="main-content" aria-label="Alterar dados de pagamento">
            <!-- Formulário demonstrativo; não informe dados reais de pagamento. -->
            <form class="form-pagamento" method="post" action="PHP/dadoPagamento_alteracao.php" aria-label="Formulário demonstrativo de pagamento">
                <input type="hidden" name="csrf" value="{{CSRF}}">
                <input type="hidden" name="id" value="{{ID}}">
                <label class="tipo-pagamento" for="credito"><input type="radio" name="tipo" id="credito" value="credito" {{CREDITO}}> Cartão de crédito</label>
                <label class="tipo-pagamento" for="debito"><input type="radio" name="tipo" id="debito" value="debito" {{DEBITO}}> Cartão de débito</label>
                <label class="tipo-pagamento" for="pix"><input type="radio" name="tipo" id="pix" value="pix" {{PIX}}> Pix</label>
                <div class="dados-cartao">
                    <div class="titulo-pagamento"><img class="icone-cartao" src="imagem_cartao.png" alt=""><h3>Dados do Cartão</h3></div>
                    <div class="campos-pagamento">
                        <div class="campo">
                            <label for="titular">Nome impresso no cartão</label>
                            <input autocomplete="off" type="text" id="titular" name="titular" maxlength="120" value="{{TITULAR}}" placeholder="Nome fictício">
                        </div>
                        <div class="campo">
                            <label for="cartao">Últimos 4 dígitos do cartão</label>
                            <input autocomplete="off" type="text" id="cartao" name="cartao" inputmode="numeric" maxlength="4" value="{{DIGITOS}}" placeholder="1234">
                        </div>
                        <div class="validade-cvc">
                            <div class="campo">
                                <label for="validade">Validade</label>
                                <input autocomplete="off" type="text" id="validade" name="validade" placeholder="MM/AA" maxlength="5" inputmode="numeric" value="{{VALIDADE}}">
                            </div>
                            <div class="campo">
                                <label for="cvc">CVC</label>
                                <input autocomplete="off" type="password" id="cvc" maxlength="4" disabled placeholder="Não coletado">
                            </div>
                        </div>
                        <div class="campo">
                            <label for="cpfTitular">CPF do titular</label>
                            <input autocomplete="off" type="text" id="cpfTitular" maxlength="14" disabled placeholder="Não coletado">
                        </div>
                    </div>
                </div>
                <div class="dados-pix">
                    <div class="titulo-pagamento"><span class="icone-pix" aria-hidden="true">▦</span><h3>Dados do Pix</h3></div>
                    <div class="campo">
                        <label for="chavePix">Chave Pix</label>
                        <input autocomplete="off" type="text" id="chavePix" name="chavePix" maxlength="120" value="{{CHAVEPIX}}" placeholder="cli***@example.com">
                    </div>
                </div>
                <div class="acoes-pagamento">
                    <a class="botao botao-pagamento" href="PHP/dadoPagamento.php">Cancelar</a>
                    <button class="botao botao-pagamento" type="submit">{{BOTAO}}</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Status do Serviço | Service Car</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cssDavi.css">
</head>

<body class="status-servico">

    <!-- ===== CABEÇALHO ===== -->
    <header class="cabecalho">
        <a href="index.html"><img class="logo" src="img/logo_sc.png" alt="Logo do Service Car"></a>

        <h1>Status do serviço</h1>

        <div class="espaco" aria-hidden="true"></div>
    </header>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main class="painel">

        <!-- ===== PROGRESSO DO SERVIÇO ===== -->
        <section class="progresso" aria-label="Progresso do serviço">
            <div class="linha-progresso">

                <div class="etapa">
                    <p>Serviço pendente</p>
                    <span class="circulo"></span>
                </div>

                <div class="etapa">
                    <p>Serviço iniciado</p>
                    <span class="circulo"></span>
                </div>

                <div class="etapa">
                    <p>Andamento</p>
                    <span class="circulo"></span>
                </div>

                <div class="etapa">
                    <p>Últimos ajustes</p>
                    <span class="circulo"></span>
                </div>

                <div class="etapa">
                    <p>Serviço finalizado</p>
                    <span class="circulo"></span>
                </div>

            </div>
        </section>

        <!-- ===== PREVISÃO DE HORÁRIO ===== -->
        <section class="previsao">
            <p>Previsão de horário:</p>
            <strong id="previsao-horario"></strong>
        </section>

        <!-- ===== INFORMAÇÕES DO SERVIÇO ===== -->
        <section class="informacoes">
            <div class="card-servico">

                <div class="imagem-servico">
                    <img src="img/polimento.jpg" alt="Imagem do serviço automotivo">
                </div>

                <div class="dados-servico">
                    <p><strong>Serviço:</strong> <span id="nome-servico"></span></p>
                    <p><strong>Empresa:</strong> <span id="empresa"></span></p>
                    <p><strong>Horário:</strong> <span id="horario"></span></p>
                    <p><strong>Local:</strong> <span id="local"></span></p>
                </div>

            </div>
        </section>

        <!-- ===== INFORMAÇÕES DO PAGAMENTO ===== -->
        <section class="info-pagamento">

            <div class="pagamento-linha">
                <strong>Forma de pagamento:</strong>
                <span id="forma-pagamento"></span>
            </div>

            <div class="pagamento-linha">
                <strong>Status do pagamento:</strong>
                <span id="status-pagamento" class="selo"></span>
            </div>

        </section>

        <!-- ===== RODAPÉ ===== -->
        <footer class="rodape">
            <a href="servicos.html">Página de serviços</a>
            <a href="historicoServico.html">Histórico de serviços →</a>
        </footer>

    </main>

    <script src="scriptdavi.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar dados gerais | Service Car</title>
    <link rel="stylesheet" href="CSS/dadoPessoal_alteração.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <nav aria-label="Cabeçalho">
            <a class="logo" href="../HTML/index.html" aria-label="Página inicial do Service Car">
                <object data="../logo_sc.png" type="image/png" aria-label="Logo Service Car">
                    <span class="logo-texto" aria-hidden="true">SERVICE<br>CAR</span>
                </object>
            </a>
            <h1>Área do Usuário</h1>
        </nav>
    </header>
    <main>
        <!-- Menu lateral -->
        <aside aria-label="Menu da área do usuário">
            <h2><a href="dadoPessoal.html" class="ativo" aria-current="true">Dados gerais</a></h2>
            <h2><a href="dadoPagamento.html">Dados de pagamento</a></h2>
        </aside>
        <!-- Conteúdo principal -->
        <section class="main-content" aria-label="Dados gerais">
            <div class="perfil">
                <div class="avatar" role="img" aria-label="Foto de perfil ilustrativa"></div>
                <input class="visualmente-oculto" type="file" id="foto" name="foto" accept="image/*">
                <label class="editar-foto" for="foto" title="Selecionar foto" aria-label="Selecionar foto de perfil">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m4 16 12-12 4 4L8 20l-5 1z"/><path d="m14 6 4 4"/></svg>
                </label>
            </div>
            <!-- Dados fictícios para demonstração do layout -->
            <div class="content" role="group" aria-label="Formulário visual de dados pessoais">
                <div class="dadosPessoais">
                    <div class="campo">
                        <label for="nome">NOME</label>
                        <input type="text" id="nome" name="nome" value="Cliente Service Car" autocomplete="name">
                    </div>
                    <div class="cpf-nascimento">
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" value="000.000.000-00" inputmode="numeric" maxlength="14">
                    </div>
                    <div class="campo">
                        <label for="dataNascimento">DATA DE NASCIMENTO</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" value="2001-01-01" autocomplete="bday">
                    </div>
                    </div>
                </div>
                <hr>
                <h2>Contato</h2>
                <div class="contato">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="cliente@example.com" autocomplete="email">
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" value="(31) 90000-0000" autocomplete="tel">
                    </div>
                </div>
                <hr>
                <h2>Endereço</h2>
                <div class="endereco">
                    <div class="campo cep">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" value="00000-000" autocomplete="postal-code" inputmode="numeric" maxlength="9">
                    </div>
                    <div class="rua-numero">
                    <div class="campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" value="Rua Exemplo" autocomplete="address-line1">
                    </div>
                    <div class="campo numero">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" value="16">
                    </div>
                    </div>
                    <div class="campo bairro">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" value="Eldorado">
                    </div>
                    <div class="cidade-estado">
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="Contagem" autocomplete="address-level2">
                    </div>
                    <div class="campo estado">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado" value="MG" autocomplete="address-level1" maxlength="2">
                    </div>
                    </div>
                </div>
                <!-- Navegação demonstrativa: não grava os dados. -->
                <a class="botao botao-pessoal" href="dadoPessoal.html">Salvar</a>
            </div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar dados gerais | Service Car</title>
    <link rel="stylesheet" href="CSS/dadoPessoal_alteracao.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <nav aria-label="Cabeçalho">
            <a class="logo" href="../HTML/index.html" aria-label="Página inicial do Service Car">
                <object data="../logo_sc.png" type="image/png" aria-label="Logo Service Car">
                    <span class="logo-texto" aria-hidden="true">SERVICE<br>CAR</span>
                </object>
            </a>
            <h1>Área do Usuário</h1>
        </nav>
    </header>
    <main>
        <!-- Menu lateral -->
        <aside aria-label="Menu da área do usuário">
            <h2><a href="dadoPessoal.html" class="ativo" aria-current="true">Dados gerais</a></h2>
            <h2><a href="PHP/dadoPagamento.php">Dados de pagamento</a></h2>
        </aside>
        <!-- Conteúdo principal -->
        <section class="main-content" aria-label="Dados gerais">
            <div class="perfil">
                <div class="avatar" role="img" aria-label="Foto de perfil ilustrativa"></div>
                <input class="visualmente-oculto" type="file" id="foto" name="foto" accept="image/png,image/jpeg,image/webp">
                <label class="editar-foto" for="foto" title="Selecionar foto" aria-label="Selecionar foto de perfil">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m4 16 12-12 4 4L8 20l-5 1z"/><path d="m14 6 4 4"/></svg>
                </label>
            </div>
            <!-- Dados fictícios para demonstração do layout -->
            <form class="content" method="post" action="PHP/dadoPessoal_alteracao.php" id="formDadosPessoais" aria-label="Formulário de dados pessoais">
                <div class="dadosPessoais">
                    <div class="campo">
                        <label for="nome">NOME</label>
                        <input type="text" id="nome" name="nome" value="Cliente Service Car" autocomplete="name" required maxlength="120">
                    </div>
                    <div class="cpf-nascimento">
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" value="000.000.000-00" inputmode="numeric" maxlength="14" required>
                    </div>
                    <div class="campo">
                        <label for="dataNascimento">DATA DE NASCIMENTO</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" value="2001-01-01" autocomplete="bday" required>
                    </div>
                    </div>
                </div>
                <hr>
                <h2>Contato</h2>
                <div class="contato">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="cliente@example.com" autocomplete="email" required maxlength="254">
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" value="(31) 90000-0000" autocomplete="tel" required maxlength="15">
                    </div>
                </div>
                <hr>
                <h2>Endereço</h2>
                <div class="endereco">
                    <div class="campo cep">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" value="00000-000" autocomplete="postal-code" inputmode="numeric" maxlength="9" required>
                    </div>
                    <div class="rua-numero">
                    <div class="campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" value="Rua Exemplo" autocomplete="address-line1" required maxlength="150">
                    </div>
                    <div class="campo numero">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" value="16" required maxlength="20">
                    </div>
                    </div>
                    <div class="campo bairro">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" value="Eldorado" required maxlength="100">
                    </div>
                    <div class="cidade-estado">
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="Contagem" autocomplete="address-level2" required maxlength="100">
                    </div>
                    <div class="campo estado">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado" value="MG" autocomplete="address-level1" maxlength="2" required>
                    </div>
                    </div>
                </div>
                <!-- O JavaScript valida e envia os dados fictícios ao PHP. -->
                <button class="botao botao-pessoal" type="submit">Salvar</button>
            </form>
        </section>
    </main>
    <script>
        // O PHP consulta e grava os dados no banco; não usamos sessionStorage.
        const campos = ['nome', 'cpf', 'dataNascimento', 'email', 'telefone',
                        'cep', 'rua', 'numero', 'bairro', 'cidade', 'estado'];
        let csrf = '';
        let fotoSelecionada = '';

        function exibirFoto(foto) {
            if (typeof foto !== 'string' || !/^data:image\/(png|jpeg|webp);base64,/.test(foto)) return;
            const avatar = document.querySelector('.avatar');
            const imagem = document.createElement('img');
            imagem.src = foto;
            imagem.alt = 'Foto de perfil da demonstração';
            avatar.replaceChildren(imagem);
            avatar.classList.add('com-foto');
            avatar.setAttribute('aria-label', 'Foto de perfil da demonstração');
        }

        // Máscaras simples de digitação (não verificam autenticidade do CPF).
        function somenteNumeros(valor) {
            return valor.replace(/\D/g, '');
        }
        document.getElementById('cpf').addEventListener('input', function () {
            this.value = somenteNumeros(this.value).slice(0, 11)
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        });
        document.getElementById('cep').addEventListener('input', function () {
            this.value = somenteNumeros(this.value).slice(0, 8)
                .replace(/(\d{5})(\d)/, '$1-$2');
        });
        document.getElementById('telefone').addEventListener('input', function () {
            const numero = somenteNumeros(this.value).slice(0, 11);
            if (numero.length <= 2) this.value = numero;
            else this.value = '(' + numero.slice(0, 2) + ') ' +
                numero.slice(2).replace(/(\d{4,5})(\d{4})$/, '$1-$2');
        });
        document.getElementById('estado').addEventListener('input', function () {
            this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2);
        });
        const nascimento = document.getElementById('dataNascimento');
        const hoje = new Date();
        nascimento.max = hoje.getFullYear() + '-' +
            String(hoje.getMonth() + 1).padStart(2, '0') + '-' +
            String(hoje.getDate()).padStart(2, '0');

        // Seleção de foto fictícia: será enviada ao PHP junto dos dados.
        const campoFoto = document.getElementById('foto');
        const salvar = document.querySelector('#formDadosPessoais button[type="submit"]');
        campoFoto.addEventListener('change', function () {
            const arquivo = this.files[0];
            if (!arquivo) return;
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(arquivo.type) || arquivo.size > 1024 * 1024) {
                alert('Escolha uma imagem fictícia JPG, PNG ou WebP de até 1 MB.');
                this.value = '';
                return;
            }
            salvar.disabled = true;
            campoFoto.disabled = true;
            const leitor = new FileReader();
            leitor.onload = function () {
                fotoSelecionada = leitor.result;
                exibirFoto(fotoSelecionada);
            };
            leitor.onerror = function () {
                alert('Não foi possível ler a imagem.');
            };
            leitor.onloadend = function () {
                salvar.disabled = false;
                campoFoto.disabled = false;
            };
            leitor.readAsDataURL(arquivo);
        });

        // Recupera o perfil e o token de segurança antes de permitir a edição.
        async function carregarDados() {
            salvar.disabled = true;
            campoFoto.disabled = true;
            try {
                const resposta = await fetch('PHP/dadoPessoal.php', {cache: 'no-store'});
                const resultado = await resposta.json();
                if (!resposta.ok) throw new Error(resultado.erro || 'Erro na consulta.');
                csrf = resultado.csrf;
                if (resultado.dados) {
                    campos.forEach(campo => {
                        const input = document.getElementById(campo);
                        input.value = resultado.dados[campo] ?? '';
                        input.dispatchEvent(new Event('input'));
                    });
                    fotoSelecionada = resultado.dados.foto || '';
                    exibirFoto(fotoSelecionada);
                }
                salvar.disabled = false;
                campoFoto.disabled = false;
            } catch (erro) {
                alert('Não foi possível carregar o perfil: ' + erro.message);
            }
        }
        carregarDados();

        // Valida o formulário e envia os dados ao arquivo PHP correspondente.
        document.getElementById('formDadosPessoais').addEventListener('submit', async function (evento) {
            evento.preventDefault();
            const novosDados = {};
            for (const campo of campos) {
                const input = document.getElementById(campo);
                novosDados[campo] = input.value.trim();
                if (!novosDados[campo]) {
                    alert('Preencha todos os campos.');
                    input.focus();
                    return;
                }
            }
            if (!/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(novosDados.cpf)) {
                alert('Informe um CPF fictício no formato 000.000.000-00.');
                return;
            }
            if (!/^\d{5}-\d{3}$/.test(novosDados.cep)) {
                alert('Informe um CEP no formato 00000-000.');
                return;
            }
            if (![10, 11].includes(somenteNumeros(novosDados.telefone).length)) {
                alert('Informe o telefone com DDD e 10 ou 11 dígitos.');
                return;
            }
            if (!/^[A-Z]{2}$/.test(novosDados.estado)) {
                alert('Informe a sigla do estado com duas letras.');
                return;
            }
            if (!confirm('Demonstração local: confirme que todos os dados e a foto são fictícios.')) return;
            if (!csrf) return;
            const formulario = new FormData();
            for (const campo of campos) formulario.append(campo, novosDados[campo]);
            formulario.append('foto', fotoSelecionada);
            formulario.append('csrf', csrf);
            salvar.disabled = true;
            campoFoto.disabled = true;
            try {
                const resposta = await fetch('PHP/dadoPessoal_alteracao.php', {
                    method: 'POST', body: formulario
                });
                const resultado = await resposta.json();
                if (!resposta.ok || !resultado.sucesso) throw new Error(resultado.erro || 'Erro ao salvar.');
                window.location.href = 'dadoPessoal.html';
            } catch (erro) {
                alert('Não foi possível salvar: ' + erro.message);
                salvar.disabled = false;
                campoFoto.disabled = false;
            }
        });
    </script>
</body>
</html>

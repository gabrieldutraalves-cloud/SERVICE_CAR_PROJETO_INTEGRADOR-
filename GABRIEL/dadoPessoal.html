<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados gerais | Service Car</title>
    <link rel="stylesheet" href="CSS/dadopessoal.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <nav aria-label="Cabeçalho">
            <a class="logo" href="../HTML/index.html" aria-label="Página inicial do Service Car">
                <object data="../logo_sc.png" type="image/png" aria-label="Logo Service Car">
                    <span class="logo-texto" aria-hidden="true">SERVICE<br>CAR</span>
                </object>
            </a>
            <h1>Área do Usuário</h1>
        </nav>
    </header>
    <main>
        <!-- Menu lateral -->
        <aside aria-label="Menu da área do usuário">
            <h2><a href="dadoPessoal.html" class="ativo" aria-current="true">Dados gerais</a></h2>
            <h2><a href="PHP/dadoPagamento.php">Dados de pagamento</a></h2>
        </aside>
        <!-- Conteúdo principal -->
        <section class="main-content" aria-label="Dados gerais">
            <div class="perfil">
                <div class="avatar" role="img" aria-label="Foto de perfil ilustrativa"></div>
            </div>
            <!-- Dados fictícios para demonstração do layout -->
            <div class="content">
                <div class="dadosPessoais">
                    <div class="campo">
                        <label for="nome">NOME</label>
                        <input type="text" id="nome" name="nome" value="Cliente Service Car" readonly autocomplete="name">
                    </div>
                    <div class="cpf-nascimento">
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" value="000.000.000-00" readonly inputmode="numeric" maxlength="14">
                    </div>
                    <div class="campo">
                        <label for="dataNascimento">DATA DE NASCIMENTO</label>
                        <input type="text" id="dataNascimento" name="dataNascimento" value="01/01/2001" readonly autocomplete="bday">
                    </div>
                    </div>
                </div>
                <hr>
                <h2>Contato</h2>
                <div class="contato">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="cliente@example.com" readonly autocomplete="email">
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" value="(31) 90000-0000" readonly autocomplete="tel">
                    </div>
                </div>
                <hr>
                <h2>Endereço</h2>
                <div class="endereco">
                    <div class="campo cep">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" name="cep" value="00000-000" readonly autocomplete="postal-code" inputmode="numeric" maxlength="9">
                    </div>
                    <div class="rua-numero">
                    <div class="campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" value="Rua Exemplo" readonly autocomplete="address-line1">
                    </div>
                    <div class="campo numero">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" name="numero" value="16" readonly>
                    </div>
                    </div>
                    <div class="campo bairro">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" value="Eldorado" readonly>
                    </div>
                    <div class="cidade-estado">
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="Contagem" readonly autocomplete="address-level2">
                    </div>
                    <div class="campo estado">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" name="estado" value="MG" readonly autocomplete="address-level1" maxlength="2">
                    </div>
                    </div>
                </div>
                <!-- A edição acontece na página de alteração. -->
                <a class="botao botao-pessoal" href="dadoPessoal_alteracao.html">Alterar</a>
            </div>
        </section>
    </main>
    <script>
        // Consulta o PHP, que é responsável pela comunicação com o MySQL.
        const campos = ['nome', 'cpf', 'dataNascimento', 'email', 'telefone',
                        'cep', 'rua', 'numero', 'bairro', 'cidade', 'estado'];
        function formatar(campo, valor) {
            if (campo === 'cpf') return valor.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
            if (campo === 'cep') return valor.replace(/^(\d{5})(\d{3})$/, '$1-$2');
            if (campo === 'telefone') return valor.replace(/^(\d{2})(\d{4,5})(\d{4})$/, '($1) $2-$3');
            if (campo === 'dataNascimento') return valor.split('-').reverse().join('/');
            return valor;
        }
        function exibirFoto(foto) {
            if (typeof foto !== 'string' || !/^data:image\/(png|jpeg|webp);base64,/.test(foto)) return;
            const avatar = document.querySelector('.avatar');
            const imagem = document.createElement('img');
            imagem.src = foto;
            imagem.alt = 'Foto de perfil';
            avatar.replaceChildren(imagem);
            avatar.classList.add('com-foto');
        }
        async function carregarDados() {
            try {
                const resposta = await fetch('PHP/dadoPessoal.php', {cache: 'no-store'});
                const resultado = await resposta.json();
                if (!resposta.ok) throw new Error(resultado.erro || 'Erro na consulta.');
                const dados = resultado.dados || {};
                campos.forEach(campo => {
                    document.getElementById(campo).value = formatar(campo, String(dados[campo] ?? ''));
                });
                exibirFoto(dados.foto);
            } catch (erro) {
                campos.forEach(campo => { document.getElementById(campo).value = ''; });
                alert('Não foi possível carregar o perfil: ' + erro.message);
            }
        }
        carregarDados();
    </script>
</body>
</html>
